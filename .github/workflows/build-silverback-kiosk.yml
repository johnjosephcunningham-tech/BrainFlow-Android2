name: Build Silverback Kiosk APK
on:
  push:
    branches: [ silverback-kiosk ]
    paths: [ 'silverback-kiosk/**', '.github/workflows/build-silverback-kiosk.yml' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: silverback-kiosk
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Silverback-Kiosk-APK
          path: silverback-kiosk/app/build/outputs/apk/debug/app-debug.apk
